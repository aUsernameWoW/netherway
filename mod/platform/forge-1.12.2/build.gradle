// Forge 1.12.2 适配层。
//
// 与 1.7.10 同用 RetroFuturaGradle（它官方同时支持 1.7.10 与 1.12.2），
// 整份构建脚本几乎就是 1.7.10 的复刻：老 ForgeGradle 2.3 的下载源同样
// 半死不活，没有理由为 1.12.2 单独维护第二套工具链。
//
// Gradle 本身需要 Java 17+ 运行；编译产物经 toolchain 固定为 Java 8 字节码。
plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'cn.ripplecraft.netherway'
version = project.modVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    // mappings 不显式指定：RFG 对 1.12.2 有内建默认（官方 testmod1.12 同样如此），
    // 手工指定反而要迁就它内部的「版本-MC 后缀」拼接规则
    // 版本号经生成的 Tags 类注入 @Mod 注解，避免在源码里写死
    injectedTags.put('VERSION', project.version)
}

tasks.injectTags.configure {
    outputClassName = 'cn.ripplecraft.netherway.forge.Tags'
}

// core 直接以源码形式编入：它零依赖、纯 Java 8，单独发布产物反而多一层要同步的东西
sourceSets.main.java.srcDir '../../core/src/main/java'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 不启动游戏，直接用 Forge 1.12.2 的 Configuration 读取真实 cfg，覆盖手写配置容错。
tasks.register('configSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs ModConfig regression tests with the real Forge configuration parser.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.ripplecraft.netherway.forge.ModConfigSelfTest'
    doFirst {
        File testWorkDir = layout.buildDirectory.dir('config-self-test').get().asFile
        testWorkDir.mkdirs()
        workingDir testWorkDir
    }
}

tasks.named('check') {
    dependsOn configSelfTest
}

// agent 二进制由 ../../build-natives.sh 产出。那个脚本刻意不注入 TOKEN/SECRET：
// mod jar 会分发给所有玩家，里面绝不能有任何密钥——凭证由服务端登录后下发。
def nativesDir = file('../../build/natives')

processResources {
    filesMatching('mcmod.info') {
        expand version: project.version, mcversion: minecraft.mcVersion.get()
    }
    // jar 内嵌 agent 二进制，第三方声明必须随之分发（Apache-2.0/MIT/BSD 都要求
    // 二进制分发时附带版权声明与许可证文本）。
    from('../../../THIRD-PARTY-NOTICES.md') { into 'META-INF' }
    // AGPL-3.0 要求随作品一并提供许可证文本。
    from('../../../LICENSE') { into 'META-INF' }
    if (nativesDir.isDirectory()) {
        from(nativesDir) { into 'natives' }
    } else {
        doFirst {
            logger.warn('警告: {} 不存在，jar 将不含 agent 二进制（先运行 mod/build-natives.sh）',
                    nativesDir)
        }
    }
}
