org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 目标 MC 与工具链
minecraft_version=1.20.1
enabled_platforms=fabric,forge

# mod 元数据（版本号与仓库根 gradle.properties 的 modVersion 保持一致）
modVersion=1.0.2
maven_group=cn.ripplecraft.netherway
archives_base_name=netherway

# loader 与 API 版本（CI 首次构建时按当版可用值校正）
fabric_loader_version=0.15.11
fabric_api_version=0.92.3+1.20.1
forge_version=1.20.1-47.2.0
