pluginManagement {
    repositories {
        // 网络不稳时可先用 curl 断点续传把大件补进 ~/.m2（gradle 自己不会续传）
        mavenLocal()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.minecraftforge.net/" }
        // 国内网络下 Gradle Plugin Portal 常不可达，阿里云镜像排前
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        gradlePluginPortal()
    }
}

include("common")
include("fabric")
include("forge")

rootProject.name = "netherway-1.20.1"
