# CI 构建。几条流水线相互独立：
#
#   go    — agent 本体的编译、vet、测试，外加两个真实二进制冒烟
#           （tunnel stdout JSON 契约、serve 内嵌信令 broker）
#   core  — Java core 用 JDK 8 编译，在 8/17/21/25 四个 JVM 上跑 SelfTest，
#           对应 GTNH 用 lwjgl3ify 把 1.7.10 跑在现代 JVM 上的场景
#   mod   — Forge 1.7.10 适配层（RetroFuturaGradle），产出可发布的 mod jar。
#           日常 commit 构建以短哈希作版本号（jar 名形如
#           netherway-forge-1.7.10-312dd35.jar，mcmod.info/@Mod 同步），
#           tag 发布则以 gradle.properties 的 modVersion 为准
#
# agent 二进制不含任何构建期密钥（mod/build-natives.sh）：它需要的全部参数
# 都在运行期由服务端下发的凭证经 -O 传入，公开发布是安全的。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 正式发布流水线复用这里的全部门禁，避免维护第二份测试清单。
  workflow_call:

# 日常 CI 只读；正式发布所需的签名与 Release 写权限只放在 release.yml。
permissions:
  contents: read

concurrency:
  # 固定 build 前缀，避免被 release.yml 复用时与外层 release-* 分组冲突。
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # 行为级契约测试在这里守门：goncp2p 的 glue 测试（自有 smux 层、
      # PROXY 头向量、origin 占位符）、internal/signalbroker 的 easyp2p
      # interop 测试（gonc 的 hello/wait 真跑在我们的 broker 上，绑定范围
      # 与 ACL）、i18n 目录一致性、cmd 的事件契约与 serve 标记。
      - run: go test -race ./...
      - name: 构建冒烟用二进制
        run: go build -trimpath -o bin/netherway-linux-amd64 ./cmd/netherway
      # tunnel 的 stdout 是 mod 逐行解析的 JSON 契约，backend 库的日志一旦
      # 漏到 stdout（gonc/paho 某次升级改了日志去向）就会破坏它——这类破坏
      # 编译与单测都抓不到。这里跑真实二进制指向无人监听的 broker 与 STUN：
      # 打洞注定失败，但 gonc 的重试会在整个超时窗口内持续产生日志，恰好
      # 压满「日志只进 stderr/文件」的契约。全程不出网：broker 与 STUN 都
      # 指向本机死端口。断言：stdout 每行都是带 event 的 JSON、首条
      # starting、末条 failed 且带 failureStage/failureCode。
      - name: tunnel stdout JSON 契约冒烟
        run: |
          if bin/netherway-linux-amd64 tunnel -backend gonc-p2p \
               -O sessionKey=ci-smoke -O room=ci-smoke \
               -O brokers=tcp://127.0.0.1:1 -O stunServers=127.0.0.1:1 \
               -timeout 6 -log-file /tmp/tunnel-smoke.log \
               >stdout.jsonl 2>stderr.log; then
            echo "指向不可达 broker 却成功就绪？"
            exit 1
          fi
          tail -20 stderr.log
          jq -es 'length >= 2
                  and all(.[]; has("event"))
                  and (.[0].event == "starting")
                  and (.[-1].event == "failed")
                  and (.[-1].failureStage | length > 0)
                  and (.[-1].failureCode | length > 0)' stdout.jsonl || {
            echo "stdout 不是纯 JSON 事件流，或事件序列不对："
            cat stdout.jsonl
            exit 1
          }
          if grep -qv '^{' stdout.jsonl; then
            echo "stdout 出现了非 JSON 行（backend 库的日志漏进来了？）："
            cat stdout.jsonl
            exit 1
          fi
      # gonc-p2p 冒烟：真实二进制跑 serve 的 wait 侧，钉住 serve 状态标记
      # 契约（cmd/netherway/serve_gonc.go 的 [serve-ready]/[serve-warn] ↔
      # Java ServeTelemetry 的常量）。正路：-rendezvous 起内嵌信令 broker
      # （internal/signalbroker，只绑回环），broker 探测打到回环即打
      # [serve-ready]，顺带钉住「内嵌信令 broker」那行文案；反路：broker
      # 指向无人监听的端口，只能看到 [serve-warn]、绝不能出现 [serve-ready]；
      # 第三条：brokers=origin 占位符没有 -rendezvous 可解析时必须立即
      # 非零退出并说明原因。全程不出网、不装任何软件：打洞只在玩家 hello
      # 后才开始，STUN 不会被联系。库层同样的契约由 internal/signalbroker
      # 的 easyp2p interop 测试钉住，这里额外覆盖 main/serveGonc 的旗标装配。
      # 文案断言以 zh 目录为基准（与 SelfTest、Go 测试一致），故固定
      # NETHERWAY_LANG=zh，不随 runner locale 漂移。
      - name: serve gonc-p2p 冒烟
        env:
          NETHERWAY_LANG: zh
        run: |
          bin/netherway-linux-amd64 serve -backend gonc-p2p \
            -rendezvous 17322 \
            -O sessionKey=ci-smoke -O room=ci-smoke \
            -port 25565 >gonc-serve.out 2>gonc-serve.err &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if grep -q "\[serve-ready\]" gonc-serve.out 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          alive=""; kill -0 "$pid" 2>/dev/null && alive=1
          kill "$pid" 2>/dev/null || true
          status=0; wait "$pid" || status=$?
          cat gonc-serve.out
          cat gonc-serve.err >&2
          if [ -z "$alive" ]; then
            echo "gonc serve 进程提前退出（exit $status）"
            exit 1
          fi
          grep -q "内嵌信令 broker" gonc-serve.out || { echo "内嵌信令 broker 未启动"; exit 1; }
          if [ -z "$ok" ]; then
            echo "gonc serve 20 秒内未打出 [serve-ready]（内嵌 broker 探测失败？标记字样变了？）"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "SIGTERM 后未干净退出（exit $status）"
            exit 1
          fi
          # 第三条：占位符无处解析 → 立即报错退出
          status=0
          bin/netherway-linux-amd64 serve -backend gonc-p2p \
            -O sessionKey=ci-smoke -O room=ci-smoke -O brokers=origin \
            -port 25565 >gonc-origin.out 2>gonc-origin.err || status=$?
          cat gonc-origin.out; cat gonc-origin.err >&2
          if [ "$status" -eq 0 ]; then
            echo "brokers=origin 无 -rendezvous 竟然没有报错退出"
            exit 1
          fi
          grep -q "占位符" gonc-origin.err gonc-origin.out || { echo "报错未说明占位符"; exit 1; }
          # 反路：无 broker 可达时只有告警标记，绝无就绪标记
          bin/netherway-linux-amd64 serve -backend gonc-p2p \
            -O sessionKey=ci-smoke -O room=ci-smoke \
            -O brokers=tcp://127.0.0.1:1 \
            -port 25565 >gonc-nobroker.out 2>gonc-nobroker.err &
          pid=$!
          warn=""
          for i in $(seq 1 30); do
            if grep -q "\[serve-warn\]" gonc-nobroker.out 2>/dev/null; then warn=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true
          cat gonc-nobroker.out
          if [ -z "$warn" ]; then
            echo "broker 不可达时 15 秒内未打出 [serve-warn]"
            exit 1
          fi
          if grep -q "\[serve-ready\]" gonc-nobroker.out; then
            echo "broker 不可达却打出了 [serve-ready]"
            exit 1
          fi

  core:
    name: Java core SelfTest (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      # 先装 8 再装运行版本：每次 setup-java 都会覆盖默认 JAVA_HOME，
      # 于是编译固定走 JAVA_HOME_8_X64，运行走默认的 java
      - name: 安装 JDK 8（编译用）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK ${{ matrix.java }}（运行用）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: 用 JDK 8 编译
        run: |
          mkdir -p mod/build/classes
          "$JAVA_HOME_8_X64/bin/javac" -encoding UTF-8 -Xlint:all \
            -d mod/build/classes $(find mod/core/src -name "*.java")
      - name: 在 JDK ${{ matrix.java }} 上跑 SelfTest
        run: java -Dfile.encoding=UTF-8 -cp mod/build/classes cn.ripplecraft.netherway.core.SelfTest

  mod:
    name: Forge 1.7.10 mod
    runs-on: ubuntu-latest
    # 首次构建（缓存未命中）要下载并反编译 Minecraft，留足余量；
    # 命中缓存时远低于此。上限的意义是别让挂死的下载吃满 6 小时配额
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # JDK 8 给编译 toolchain，JDK 21 给 Gradle/RFG 自己；顺序决定默认值
      - name: 安装 JDK 8（编译 toolchain）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      # 首次构建 RFG 要下载并反编译 Minecraft（缓存约 1-2GB），
      # 没有这个缓存的话每次 push 都要重来一遍
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        run: ./mod/build-natives.sh
      # commit 构建的版本号用短哈希覆盖（命令行 -P 优先于 gradle.properties），
      # jar 文件名与 mcmod.info/@Mod（经 Tags 注入）随 project.version 同源联动，
      # 拿到任何一个 CI jar 都能对应回具体 commit。tag 构建（release.yml 经
      # workflow_call 复用本流水线）不覆盖：版本以 gradle.properties 为准，
      # release.yml 会校验它与 tag 一致，artifact 名也必须与那边的下载名对上。
      # PR 构建标注 PR 分支头，而不是每次重跑都变的临时 merge commit。
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            echo "flag=-PmodVersion=${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/forge-1.7.10
        # fromEnv 让 Gradle 的 toolchain 探测认到 setup-java 装的 JDK 8
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 --console=plain
      - name: 定位唯一的发布版 JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/forge-1.7.10/build/libs" \
              -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf '预期恰好一个非 -dev 发布 JAR，实际找到 %d 个：\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error

  mod-1122:
    name: Forge 1.12.2 mod
    runs-on: ubuntu-latest
    # 与 forge-1.7.10 同为 RFG：首次要下载并反编译 Minecraft，留足余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 安装 JDK 8（编译 toolchain）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        run: ./mod/build-natives.sh
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            echo "flag=-PmodVersion=${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
      # build 已含 configSelfTest（用真实 Forge 1.12.2 Configuration 解析器）
      - name: Gradle build
        working-directory: mod/platform/forge-1.12.2
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 --console=plain
      - name: 定位唯一的发布版 JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/forge-1.12.2/build/libs" \
              -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf '预期恰好一个非 -dev 发布 JAR，实际找到 %d 个：\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error

  mod-modern:
    # Architectury Loom 多 loader 工作区，一套源码经 mojmap 同时出 Forge+Fabric。
    # 三个版本各自独立工作区（可各自 pin loom 版本），矩阵并行、互不 fail-fast：
    # 1.16.5 是本方案唯一真风险点（arch-loom 对该版偏边缘），单独红不拖累其余。
    name: Modern ${{ matrix.mc }} (Forge+Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.16.5'
            toolchain: '8'
            from_env: 'JAVA_HOME_8_X64'
          - mc: '1.18.2'
            toolchain: '17'
            from_env: 'JAVA_HOME_17_X64'
          - mc: '1.20.1'
            toolchain: '17'
            from_env: 'JAVA_HOME_17_X64'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # 装齐三档 JDK：8/17 供 toolchain（按版本挑），21 跑 Gradle/loom。
      # 顺序靠后的成为默认 JAVA_HOME，故最后装 21。
      - name: 安装 JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        run: ./mod/build-natives.sh
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            echo "flag=-PmodVersion=${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/modern/${{ matrix.mc }}
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=${{ matrix.from_env }}
          --console=plain
      # 每版本产出 forge + fabric 两个重映射 jar，命名与 1.7.10/1.12.2 同构：
      # netherway-<loader>-<mc>-<版本或短哈希>.jar。中间产物（-dev-shadow 的
      # 未重映射 shadow jar、-sources）绝不上传。
      - name: 定位 forge/fabric 发布 JAR
        id: jars
        shell: bash
        run: |
          base="$GITHUB_WORKSPACE/mod/platform/modern/${{ matrix.mc }}"
          for loader in forge fabric; do
            mapfile -t found < <(
              find "$base/$loader/build/libs" -maxdepth 1 -type f -name '*.jar' \
                ! -name '*-dev*.jar' ! -name '*-sources.jar' -print
            )
            if [ "${#found[@]}" -ne 1 ]; then
              printf '预期 %s 侧恰好一个发布 JAR，实际 %d 个：\n' "$loader" "${#found[@]}"
              printf '%s\n' "${found[@]}"
              exit 1
            fi
            printf '%s=%s\n' "$loader" "${found[0]}" >> "$GITHUB_OUTPUT"
          done
      # archive:false 让 artifact 名就是 JAR 文件名，与 1.7.10/1.12.2 的
      # 上传方式一致（release.yml 依赖这一约定按文件名下载）
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.forge }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.fabric }}
          archive: false
          if-no-files-found: error

  plugin-bukkit:
    # Bukkit/Spigot/Paper server-side plugin. Plain Java project (no Loom, no
    # Minecraft decompilation): compiles core + the Minecraft-free server half
    # of modern/shared against spigot-api 1.13, emits one version-spanning jar
    # named like the mod jars (netherway-bukkit-<version or short hash>.jar).
    name: Bukkit plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # JDK 17 for the compile toolchain (targets Java 8 bytecode via
      # --release), JDK 21 for Gradle itself; the last install wins JAVA_HOME.
      - name: Install JDK 17 (compile toolchain)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Install JDK 21 (runs Gradle)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the bundled agent binaries (no secrets)
        run: ./mod/build-natives.sh
      - name: Resolve plugin version
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            echo "flag=-PmodVersion=${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/bukkit
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          --console=plain
      - name: Locate the release JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/bukkit/build/libs" \
              -maxdepth 1 -type f -name '*.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one release JAR, found %d:\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error
