# CI 构建。三条流水线相互独立：
#
#   go    — agent 本体的编译、vet、测试，外加三个真实二进制冒烟
#           （build.sh 注入、tunnel stdout 契约、serve 内嵌会合点）
#   core  — Java core 用 JDK 8 编译，在 8/17/21/25 四个 JVM 上跑 SelfTest，
#           对应 GTNH 用 lwjgl3ify 把 1.7.10 跑在现代 JVM 上的场景
#   mod   — Forge 1.7.10 适配层（RetroFuturaGradle），产出可发布的 mod jar。
#           日常 commit 构建以短哈希作版本号（jar 名形如
#           netherway-forge-1.7.10-312dd35.jar，mcmod.info/@Mod 同步），
#           tag 发布则以 gradle.properties 的 modVersion 为准
#
# 这里刻意不接触 TOKEN/SECRET：mod jar 打包的 agent 二进制经
# mod/build-natives.sh 构建、不含任何密钥，公开发布是安全的。
# 根目录 build.sh 产出的独立 agent 内嵌 frps 令牌与房间密钥，
# 那类产物绝不能挂到公开的 Release / artifact 上——如需 CI 构建，
# 单独开私有渠道，别往这个文件里加。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 正式发布流水线复用这里的全部门禁，避免维护第二份测试清单。
  # natives_variant 供 variants.yml 复用：把裁剪过 backend 的 agent 二进制
  # 打进 jar（all/frp/gonc），非 all 时 jar 版本号带 -frp/-gonc 后缀。
  # release.yml 不传该输入，发布行为不受影响。
  workflow_call:
    inputs:
      natives_variant:
        description: backends compiled into the bundled agent (all/frp/gonc)
        type: string
        required: false
        default: all

# 日常 CI 只读；正式发布所需的签名与 Release 写权限只放在 release.yml。
permissions:
  contents: read

concurrency:
  # 固定 build 前缀，避免被 release.yml 复用时与外层 release-* 分组冲突。
  # 组名带上变体：variants.yml 会对同一 ref 并行调两次本工作流，
  # 不区分的话两次调用会互相取消。
  group: build-${{ inputs.natives_variant || 'all' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 变体流水线只裁 natives、不改 Go/core 逻辑，这两个门禁在默认构建里
    # 已经跑过，变体调用时跳过以省一半时长。
    if: ${{ (inputs.natives_variant || 'all') == 'all' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # 跨语言契约测试（authplugin 的已知答案向量）在这里守门：
      # 只 build 不 test 的话，契约被改坏要到 Java 侧 SelfTest 才炸，甚至漏网。
      # internal/rendezvous 的 interop 测试也在其中：frp client 库真连内嵌
      # 会合点，钉住登录与代理注册的放行/拒绝规则（frp bump 的行为级防线）。
      # 不开 -race：frp 自身关停路径带数据竞争，见 interop_test.go 头注。
      - run: go test ./...
      # 变体裁剪（-tags nofrp / nogonc，见 cmd/netherway/backends.go）平时
      # 没人本地开着编，这里保证两个 tag 组合始终能编译。
      - name: 变体构建门禁（nofrp / nogonc）
        run: |
          go build -tags nofrp ./cmd/netherway
          go vet -tags nofrp ./cmd/netherway
          go build -tags nogonc ./cmd/netherway
          go vet -tags nogonc ./cmd/netherway
      # build.sh 的 -X symbol 名与 internal/config 的变量名是逐字契约，
      # symbol 写错时 Go 会静默忽略、构建照样成功——真实打包时默认值就悄悄
      # 丢了。这里用占位值（无任何真实密钥）构建单平台，断言每个注入值
      # 确实落进了二进制。
      - name: build.sh 注入冒烟（占位值）
        run: |
          ONLY=linux/amd64 \
          SERVER_ADDR=203.0.113.99 SERVER_PORT=7391 ROOM=ci-smoke-room \
          TOKEN=ci-dummy-token SECRET=ci-dummy-secret \
            ./build.sh
          for v in 203.0.113.99 7391 ci-smoke-room \
                   ci-dummy-token ci-dummy-secret; do
            grep -aq "$v" bin/netherway-linux-amd64 || {
              echo "注入值 $v 未落进二进制：-X symbol 名与 internal/config 失配？"
              exit 1
            }
          done
      # tunnel 的 stdout 是 mod 逐行解析的 JSON 契约，frp 的日志一旦漏到
      # stdout（例如新版 frp 在 initFrpLogger 生效前打印）就会破坏它——
      # 这类破坏编译与单测都抓不到。这里跑真实二进制指向不可达的 frps：
      # 打洞注定失败，但 frp 的登录重试会在整个超时窗口内持续产生日志，
      # 恰好压满「日志只进 stderr/文件」的契约。frp 依赖自动升级
      # （dependabot auto-merge）后，这是行为级回归的主要防线。
      # STUN 探测失败也没关系：starting 在 backend 启动前就已发出，
      # failed 的原因不同但断言不变。
      - name: tunnel stdout JSON 契约冒烟
        run: |
          if bin/netherway-linux-amd64 tunnel \
               -server 127.0.0.1 -server-port 1 -token ci \
               -room ci-smoke -secret ci-smoke -timeout 6 \
               -log-file /tmp/tunnel-smoke.log \
               >stdout.jsonl 2>stderr.log; then
            echo "指向不可达 frps 却成功就绪？"
            exit 1
          fi
          tail -20 stderr.log
          jq -es 'length >= 2
                  and (.[0].event == "starting")
                  and (.[-1].event == "failed")' stdout.jsonl || {
            echo "stdout 不是纯 JSON 事件流，或事件序列不对："
            cat stdout.jsonl
            exit 1
          }
      # 内嵌会合点冒烟：真实二进制跑通「起会合点 → serve 的 frpc 从回环连
      # 回来 → 过内嵌 authplugin → 注册 xtcp 代理」全链路，再验证 SIGTERM
      # 干净退出。全程不出网：STUN 只在真正打洞时才会被联系，而 stunpick
      # 对单个候选不做探测直接放行。库层同样的契约由 internal/rendezvous
      # 的 interop 测试钉住，这里额外覆盖 main/serveEmbedded 的旗标装配、
      # 自用静态令牌生成与信号退出路径。「start proxy success」是 frp 的
      # 日志原文，刻意用作 frp bump 的绊线——frp 若改了字样，这里跟着改。
      # 文案断言以 zh 目录为基准（与 SelfTest、Go 测试一致），故固定
      # NETHERWAY_LANG=zh，不随 runner locale 漂移。
      - name: serve 内嵌会合点冒烟
        env:
          NETHERWAY_LANG: zh
        run: |
          bin/netherway-linux-amd64 serve \
            -rendezvous 17321 -port 25565 \
            -room ci-smoke -secret ci-smoke -token ci-token \
            -signing-key ci-signing-key \
            -stun 127.0.0.1:1 \
            >serve.out 2>serve.err &
          pid=$!
          ok=""
          for i in $(seq 1 40); do
            if grep -q "start proxy success" serve.out 2>/dev/null; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          status=0; wait "$pid" || status=$?
          cat serve.out
          cat serve.err >&2
          grep -q "内嵌会合点" serve.out || { echo "会合点未启动"; exit 1; }
          if [ -z "$ok" ]; then
            echo "serve 未能在内嵌会合点上注册代理（登录或 NewProxy 被拒？）"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "SIGTERM 后未干净退出（exit $status）"
            exit 1
          fi

  core:
    name: Java core SelfTest (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 同 go：变体只改 natives，core 无需重跑。
    if: ${{ (inputs.natives_variant || 'all') == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      # 先装 8 再装运行版本：每次 setup-java 都会覆盖默认 JAVA_HOME，
      # 于是编译固定走 JAVA_HOME_8_X64，运行走默认的 java
      - name: 安装 JDK 8（编译用）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK ${{ matrix.java }}（运行用）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - name: 用 JDK 8 编译
        run: |
          mkdir -p mod/build/classes
          "$JAVA_HOME_8_X64/bin/javac" -encoding UTF-8 -Xlint:all \
            -d mod/build/classes $(find mod/core/src -name "*.java")
      - name: 在 JDK ${{ matrix.java }} 上跑 SelfTest
        run: java -Dfile.encoding=UTF-8 -cp mod/build/classes cn.ripplecraft.netherway.core.SelfTest

  mod:
    name: Forge 1.7.10 mod
    runs-on: ubuntu-latest
    # 首次构建（缓存未命中）要下载并反编译 Minecraft，留足余量；
    # 命中缓存时远低于此。上限的意义是别让挂死的下载吃满 6 小时配额
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # JDK 8 给编译 toolchain，JDK 21 给 Gradle/RFG 自己；顺序决定默认值
      - name: 安装 JDK 8（编译 toolchain）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      # 首次构建 RFG 要下载并反编译 Minecraft（缓存约 1-2GB），
      # 没有这个缓存的话每次 push 都要重来一遍
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        env:
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: ./mod/build-natives.sh
      # commit 构建的版本号用短哈希覆盖（命令行 -P 优先于 gradle.properties），
      # jar 文件名与 mcmod.info/@Mod（经 Tags 注入）随 project.version 同源联动，
      # 拿到任何一个 CI jar 都能对应回具体 commit。tag 构建（release.yml 经
      # workflow_call 复用本流水线）不覆盖：版本以 gradle.properties 为准，
      # release.yml 会校验它与 tag 一致，artifact 名也必须与那边的下载名对上。
      # PR 构建标注 PR 分支头，而不是每次重跑都变的临时 merge commit。
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            suffix=""
            if [ "$VARIANT" != "all" ]; then suffix="-$VARIANT"; fi
            echo "flag=-PmodVersion=${sha:0:7}${suffix}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/forge-1.7.10
        # fromEnv 让 Gradle 的 toolchain 探测认到 setup-java 装的 JDK 8
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 --console=plain
      - name: 定位唯一的发布版 JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/forge-1.7.10/build/libs" \
              -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf '预期恰好一个非 -dev 发布 JAR，实际找到 %d 个：\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error

  mod-1122:
    name: Forge 1.12.2 mod
    runs-on: ubuntu-latest
    # 与 forge-1.7.10 同为 RFG：首次要下载并反编译 Minecraft，留足余量
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 安装 JDK 8（编译 toolchain）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        env:
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: ./mod/build-natives.sh
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            suffix=""
            if [ "$VARIANT" != "all" ]; then suffix="-$VARIANT"; fi
            echo "flag=-PmodVersion=${sha:0:7}${suffix}" >> "$GITHUB_OUTPUT"
          fi
      # build 已含 configSelfTest（用真实 Forge 1.12.2 Configuration 解析器）
      - name: Gradle build
        working-directory: mod/platform/forge-1.12.2
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 --console=plain
      - name: 定位唯一的发布版 JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/forge-1.12.2/build/libs" \
              -maxdepth 1 -type f -name '*.jar' ! -name '*-dev.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf '预期恰好一个非 -dev 发布 JAR，实际找到 %d 个：\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error

  mod-modern:
    # Architectury Loom 多 loader 工作区，一套源码经 mojmap 同时出 Forge+Fabric。
    # 三个版本各自独立工作区（可各自 pin loom 版本），矩阵并行、互不 fail-fast：
    # 1.16.5 是本方案唯一真风险点（arch-loom 对该版偏边缘），单独红不拖累其余。
    name: Modern ${{ matrix.mc }} (Forge+Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.16.5'
            toolchain: '8'
            from_env: 'JAVA_HOME_8_X64'
          - mc: '1.18.2'
            toolchain: '17'
            from_env: 'JAVA_HOME_17_X64'
          - mc: '1.20.1'
            toolchain: '17'
            from_env: 'JAVA_HOME_17_X64'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # 装齐三档 JDK：8/17 供 toolchain（按版本挑），21 跑 Gradle/loom。
      # 顺序靠后的成为默认 JAVA_HOME，故最后装 21。
      - name: 安装 JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 8
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - name: 安装 JDK 21（运行 Gradle）
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建打进 jar 的 agent 二进制（无密钥）
        env:
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: ./mod/build-natives.sh
      - name: 确定 mod 版本号
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            suffix=""
            if [ "$VARIANT" != "all" ]; then suffix="-$VARIANT"; fi
            echo "flag=-PmodVersion=${sha:0:7}${suffix}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/modern/${{ matrix.mc }}
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=${{ matrix.from_env }}
          --console=plain
      # 每版本产出 forge + fabric 两个重映射 jar，命名与 1.7.10/1.12.2 同构：
      # netherway-<loader>-<mc>-<版本或短哈希>.jar。中间产物（-dev-shadow 的
      # 未重映射 shadow jar、-sources）绝不上传。
      - name: 定位 forge/fabric 发布 JAR
        id: jars
        shell: bash
        run: |
          base="$GITHUB_WORKSPACE/mod/platform/modern/${{ matrix.mc }}"
          for loader in forge fabric; do
            mapfile -t found < <(
              find "$base/$loader/build/libs" -maxdepth 1 -type f -name '*.jar' \
                ! -name '*-dev*.jar' ! -name '*-sources.jar' -print
            )
            if [ "${#found[@]}" -ne 1 ]; then
              printf '预期 %s 侧恰好一个发布 JAR，实际 %d 个：\n' "$loader" "${#found[@]}"
              printf '%s\n' "${found[@]}"
              exit 1
            fi
            printf '%s=%s\n' "$loader" "${found[0]}" >> "$GITHUB_OUTPUT"
          done
      # archive:false 让 artifact 名就是 JAR 文件名，与 1.7.10/1.12.2 的
      # 上传方式一致（release.yml 依赖这一约定按文件名下载）
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.forge }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.jars.outputs.fabric }}
          archive: false
          if-no-files-found: error

  plugin-bukkit:
    # Bukkit/Spigot/Paper server-side plugin. Plain Java project (no Loom, no
    # Minecraft decompilation): compiles core + the Minecraft-free server half
    # of modern/shared against spigot-api 1.13, emits one version-spanning jar
    # named like the mod jars (netherway-bukkit-<version or short hash>.jar).
    name: Bukkit plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # JDK 17 for the compile toolchain (targets Java 8 bytecode via
      # --release), JDK 21 for Gradle itself; the last install wins JAVA_HOME.
      - name: Install JDK 17 (compile toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - name: Install JDK 21 (runs Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the bundled agent binaries (no secrets)
        env:
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: ./mod/build-natives.sh
      - name: Resolve plugin version
        id: modver
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VARIANT: ${{ inputs.natives_variant || 'all' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo 'flag=' >> "$GITHUB_OUTPUT"
          else
            sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
            suffix=""
            if [ "$VARIANT" != "all" ]; then suffix="-$VARIANT"; fi
            echo "flag=-PmodVersion=${sha:0:7}${suffix}" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle build
        working-directory: mod/platform/bukkit
        run: >-
          ./gradlew build ${{ steps.modver.outputs.flag }}
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
          --console=plain
      - name: Locate the release JAR
        id: release-jar
        shell: bash
        run: |
          mapfile -t jars < <(
            find "$GITHUB_WORKSPACE/mod/platform/bukkit/build/libs" \
              -maxdepth 1 -type f -name '*.jar' -print
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one release JAR, found %d:\n' "${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          printf 'path=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.release-jar.outputs.path }}
          archive: false
          if-no-files-found: error
