# Dependency updates. Paired with workflows/dependabot-automerge.yml: a
# bump whose CI comes back green is merged automatically.
#
# Auto-merge is safe for the dependencies below because a library API
# break surfaces as a compile failure, which CI catches before the PR can
# merge, and the "compiles but behaves differently" surface is fenced by
# behavior-level tests: build.yml's tunnel stdout smoke (a library log line
# leaking into stdout would break the mod's JSON contract) and its serve
# smoke (embedded signaling broker up → [serve-ready]), plus the
# internal/signalbroker interop test that runs gonc's real hello/wait
# against our broker.
#
# Gradle (mod/platform/*) is deliberately excluded: RetroFuturaGradle and
# the 1.7.10 ecosystem are pinned, automatic bumps only cause churn.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
    # gonc and smux ARE the wire between two copies of our own binary
    # (punch signaling, DTLS/TLS negotiation, the mux framing). gonc gives no
    # cross-version compatibility promise and smux's major bump (1.5 -> 2.0)
    # was auto-merged on 2026-09-02 before anyone looked. Bumping either must
    # ship client and server mods together with the goncp2p glue tests and a
    # real-machine smoke (CLAUDE.md, "gonc-p2p backend"), so they are bumped
    # by hand, never by this bot.
    ignore:
      - dependency-name: github.com/threatexpert/gonc/v2
      - dependency-name: github.com/xtaci/smux
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
